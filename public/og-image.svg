<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogGrad)"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Content -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    Chanakya Nalajala
  </text>
  
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="42" fill="#94a3b8">
    Senior Full-Stack Engineer
  </text>
  
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="32" fill="#64748b">
    Java • Spring Boot • Angular • React
  </text>
  
  <text x="100" y="420" font-family="Arial, sans-serif" font-size="32" fill="#64748b">
    Microservices • Spring Cloud • Performance Optimization
  </text>
  
  <!-- Highlight Box -->
  <rect x="100" y="480" width="500" height="80" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="530" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6366f1" text-anchor="middle">
    6+ Years Experience
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="1050" cy="150" r="80" fill="rgba(99, 102, 241, 0.1)"/>
  <circle cx="1100" cy="500" r="60" fill="rgba(139, 92, 246, 0.1)"/>
</svg>
